<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
  </head>
  <body>
    <!--
      This is the "root" element React mounts into.
      React replaces the contents of this div with the component tree.
      The HTML file itself is basically empty — React generates all the UI.
    -->
    <div id="root"></div>
    <!--
      type="module" tells the browser this is an ES module.
      Vite intercepts this request and serves the TypeScript file directly
      in development (no compilation step needed).
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
